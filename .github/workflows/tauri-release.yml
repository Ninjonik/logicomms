name: tauri-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: [self-hosted, windows, x64, logicomms-builder]
    permissions:
      contents: read
    env:
      VITE_API_URL: https://logicomms.igportals.eu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Compute commit-based version
        shell: pwsh
        run: |
          $count = git rev-list --count HEAD
          $sha = git rev-parse --short=8 HEAD
          $version = "0.1.$count"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch package and tauri versions
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $env:APP_VERSION
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json
          $tauri = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauri.version = $env:APP_VERSION
          $tauri | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json

      - name: Build signed updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Generate updater manifest
        shell: pwsh
        env:
          VERSION: ${{ env.APP_VERSION }}
          NOTES: "Commit ${{ env.APP_SHA }}"
          BASE_URL: https://logicomms.igportals.eu/downloads
        run: node scripts/build-release-manifest.mjs

      - name: Upload updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: logicomms-windows-release
          path: |
            backend/releases/latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
